[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spraulron"
version = "0.1.0"
description = "Locally hosted tracker for NE Ohio (Summit, Cuyahoga, Stark) multifamily homes on the market or at auction, with FHA first-time-buyer math."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "jinja2>=3.1,<4", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "pydantic>=2.7,<3", "python-dotenv>=1.0,<2",
  "tomli>=2.0,<3", "homeharvest>=0.8,<1",
]

[project.scripts]
spraulron = "spraulron.__main__:main"

[tool.setuptools.packages.find]
include = ["spraulron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
